name: MUSLIM VPS MANAGER

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verifier les secrets
        env:
          HAS_BOT_TOKEN: ${{ secrets.BOT_TOKEN != '' }}
          HAS_ADMIN_ID: ${{ secrets.ADMIN_ID != '' }}
          HAS_ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME != '' }}
          HAS_VPS_IP: ${{ secrets.VPS_IP != '' }}
          HAS_DEFAULT_PORT: ${{ secrets.DEFAULT_PORT != '' }}
          HAS_DB_PATH: ${{ secrets.DB_PATH != '' }}
          HAS_SCRIPTS_DIR: ${{ secrets.SCRIPTS_DIR != '' }}
          HAS_SPAM_DELAY: ${{ secrets.SPAM_DELAY != '' }}
          HAS_MAX_MSG_LENGTH: ${{ secrets.MAX_MSG_LENGTH != '' }}
        run: |
          echo "BOT_TOKEN present: $HAS_BOT_TOKEN"
          echo "ADMIN_ID present: $HAS_ADMIN_ID"
          echo "ADMIN_USERNAME present: $HAS_ADMIN_USERNAME"
          echo "VPS_IP present: $HAS_VPS_IP"
          echo "DEFAULT_PORT present: $HAS_DEFAULT_PORT"
          echo "DB_PATH present: $HAS_DB_PATH"
          echo "SCRIPTS_DIR present: $HAS_SCRIPTS_DIR"
          echo "SPAM_DELAY present: $HAS_SPAM_DELAY"
          echo "MAX_MSG_LENGTH present: $HAS_MAX_MSG_LENGTH"

          test "$HAS_BOT_TOKEN" = "true"
          test "$HAS_ADMIN_ID" = "true"
          test "$HAS_VPS_IP" = "true"

          echo "Secrets obligatoires presents."

      - name: Creer config.py depuis les secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          VPS_IP: ${{ secrets.VPS_IP }}
          DEFAULT_PORT: ${{ secrets.DEFAULT_PORT }}
          DB_PATH: ${{ secrets.DB_PATH }}
          SCRIPTS_DIR: ${{ secrets.SCRIPTS_DIR }}
          SPAM_DELAY: ${{ secrets.SPAM_DELAY }}
          MAX_MSG_LENGTH: ${{ secrets.MAX_MSG_LENGTH }}
        run: |
          cat > config.py <<PYEOF
          BOT_TOKEN = ${BOT_TOKEN@Q}
          ADMIN_ID = ${ADMIN_ID@Q}
          ADMIN_USERNAME = ${ADMIN_USERNAME@Q}
          VPS_IP = ${VPS_IP@Q}
          DEFAULT_PORT = ${DEFAULT_PORT@Q}
          DB_PATH = ${DB_PATH@Q}
          SCRIPTS_DIR = ${SCRIPTS_DIR@Q}
          SPAM_DELAY = ${SPAM_DELAY@Q}
          MAX_MSG_LENGTH = ${MAX_MSG_LENGTH@Q}
          PYEOF

      - name: Lancer le bot Telegram
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u bot.py
